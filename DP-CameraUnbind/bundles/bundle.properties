setting.dp-camera-unbind.name = Unbind camera (unit walks to the cursor)
setting.dp-camera-unbind.description = With the built-in free camera on, holding the mouse-move key makes your unit walk to where the cursor points and stop there, while the camera stays completely still.\nVanilla instead flies the unit toward the screen center, so the view keeps scrolling as if the camera were chasing the unit.\nNothing happens while the free camera is off. F10 toggles this feature, F9 toggles "academic-build feel".
setting.dp-camera-unbind-legacy.name = Academic-build feel (unit walks to the screen center)
setting.dp-camera-unbind-legacy.description = Unit movement goes back to exactly what vanilla does: target = the screen center, stop and brake within 15 tiles.\nWASD pans the camera instead of moving the unit.\nThe "camera is not pushed toward the cursor while the move key is held" clamp still applies.\nReproduces the hand-written free camera of the v146 academic build (BE-25737).\nOff by default; F9 toggles it.
