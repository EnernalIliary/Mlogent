setting.dp-camera-unbind.name = 鏡頭解綁（單位走到滑鼠位置）
setting.dp-camera-unbind.description = 開著「自由視角」時，按住滑鼠移動鍵會讓單位走到\n滑鼠指的位置就停下，相機全程一動不動。\n原版是讓單位一直朝螢幕中心飛，所以畫面會一直捲動，\n看起來像鏡頭在追著單位。\n自由視角關著時本模組不生效；按 F10 開關本功能，按 F9 切換「學術端原味」。
setting.dp-camera-unbind-legacy.name = 學術端原味（單位朝螢幕中心走）
setting.dp-camera-unbind-legacy.description = 勾上後單位移動完全按原版：目標 = 螢幕中心，\n走到 15 格內停下並煞車；WASD 變成平移鏡頭而不是移動單位。\n「按住移動鍵時鏡頭不被推向滑鼠」這條壓制仍然有效。\n複刻的是 v146 學術端（BE-25737）自己寫的那份自由視角的手感。\n預設關；按 F9 切換。
