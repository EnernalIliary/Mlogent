setting.dp-camera-unbind.name = Unbind camera (unit walks to the cursor)
setting.dp-camera-unbind.description = With the built-in free camera on, holding the mouse-move key makes your unit walk to where the cursor points and stop there, while the camera stays completely still.\nVanilla instead flies the unit toward the screen center, so the view keeps scrolling as if the camera were chasing the unit.\nNothing happens while the free camera is off. N pulls the view back to the unit, V toggles this.
