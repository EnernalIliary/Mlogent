name: gates

# Linux 静态门禁。Windows 对应检查由 ci.yml 的仓库门禁和完整性步骤负责。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repo integrity (tools / tests / rules)
        run: python tools/check_manifest.py

      - name: Golden corpus (blueprints byte-for-byte)
        run: python tests/run_tests.py

      - name: Docs signatures (instr_semantics agreement)
        run: python tests/docsig/run_docsig.py

      - name: Rule ids fire on fixtures
        run: python tests/ruleids/run_ruleids.py

      - name: Shape matrix
        run: python tests/shapes/run_shapes.py

      - name: Knowledge schema
        run: python knowledge/tools/check_kb.py --root knowledge --all
