setting.dp-camera-unbind.name = 镜头解绑（单位走到鼠标位置）
setting.dp-camera-unbind.description = 开着「自由视角」时，按住鼠标移动键会让单位走到\n鼠标指的位置就停下，相机全程一动不动。\n原版是让单位一直朝屏幕中心飞，所以画面会一直滚，\n看起来像镜头在追着单位。\n自由视角关着时本模组不生效；按 F10 开关本功能，按 F9 切换「学术端原味」。
setting.dp-camera-unbind-legacy.name = 学术端原味（单位朝屏幕中心走）
setting.dp-camera-unbind-legacy.description = 勾上后单位移动完全按原版：目标 = 屏幕中心，\n走到 15 格内停下并刹车；WASD 变成平移镜头而不是移动单位。\n「按住移动键时镜头不被推向鼠标」这条压制仍然有效。\n复刻的是 v146 学术端（BE-25737）自己写的那份自由视角的手感，\n考据见 LEGACY-FREECAM.md。默认关；按 F9 切换。
