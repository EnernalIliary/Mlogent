name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Windows runner 的默认编码是 cp1252：工具打印中文（如签名作者）会 UnicodeEncodeError，
  # 强制 UTF-8 后与本地一致。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    name: 测试（windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 模组（MlogAuxiliary / GriefToBan）已拆为同级独立项目，本仓库不再带它们的脚本，
      # gate.py 会把依赖它们的步骤降级为 SKIP（quickcheck / rhinoparity / ui / package / gtb）。
      - name: 仓库门禁
        run: python gate.py

      - name: 完整性清单
        run: python tools/check_manifest.py

      - name: 检查器与工具链
        run: python tests/run_tests.py

      - name: 蓝图形状
        run: python tests/shapes/run_shapes.py

      - name: 规则覆盖（规则 id 与 fixture 对账）
        run: python tests/ruleids/run_ruleids.py

  portability:
    name: 路径假设（linux，非阻塞）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python tests/run_tests.py

      - run: python tests/ruleids/run_ruleids.py
