name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Windows runner 的默认编码是 cp1252：工具打印中文（如签名作者）会 UnicodeEncodeError，
  # 强制 UTF-8 后与本地一致。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: 测试（windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 模组（MlogAuxiliary / GriefToBan）已拆为同级独立项目，本仓库不再带它们的脚本，
      # gate.py 会把依赖它们的步骤降级为 SKIP（quickcheck / rhinoparity / ui / package / gtb）。
      - name: 仓库门禁
        run: python gate.py

      - name: 完整性清单
        run: python tools/check_manifest.py

      - name: 知识库结构
        run: python knowledge/tools/check_kb.py --root knowledge --all

      - name: DSH 技能文档同步
        run: python dsh-preset-mlog/sync_blueprint_docs.py --check
